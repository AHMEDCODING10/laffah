name: laffah
description: >-
  laffahh - motorcycle ride-hailing and express parcel delivery for Sanaa Yemen.
version: 1.0.2+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  meta: ^1.15.0
  go_router: ^14.6.1
  flutter_svg: ^2.0.10+125
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  collection: ^1.18.0
  freezed_annotation: ^2.4.4
  dio: ^5.4.0
  dartz: ^0.10.1
  flutter_secure_storage: ^10.0.0
  get_it: ^7.6.4
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  geolocator: ^13.0.0
  web_socket_channel: ^3.0.1
  flutter_dotenv: ^6.0.1
  pusher_channels_flutter: ^2.6.0
  laravel_echo: ^1.0.0-beta.1
  flutter_map: ^8.3.1
  flutter_map_cancellable_tile_provider: ^3.1.1
  latlong2: ^0.9.1
  shimmer: ^3.0.0
  # Firebase Push Notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    #- assets/icons/
    - assets/fonts/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.jpeg"
  min_sdk_android: 21